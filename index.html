<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m1c3_n04</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:#000;
  color:#fff;
  /* Courier New 字体 */
  font-family: "Courier New", Consolas, Monospace;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 20px;
  cursor:pointer;
}

/* CRT扫描线 */
.scanlines {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:linear-gradient(to bottom, transparent 50%, rgba(20,20,20,.3) 50%);
  background-size:100% 4px;
  pointer-events:none;
  z-index:10;
}

.container {
  max-width:820px;
  width:100%;
  animation:fade 1s forwards;
  position:relative;
  z-index:1;
}

@keyframes fade {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.header {
  text-align:left;
  margin-bottom:20px;
  padding-left:4px;
}

.nick {
  font-size:48px;
  font-weight:900;
  color:#fff;
  text-shadow:0 0 12px #fff;
}

.real-name {
  font-size:18px;
  color:#ddd;
  margin-top:8px;
  text-shadow:0 0 6px #ddd;
}

/* 时间样式 */
.time {
  font-size:16px;
  color:#fff;
  margin-top:6px;
  text-shadow:0 0 8px #fff;
}

.post {
  background:rgba(20,20,20,.7);
  border:1px solid #fff;
  border-radius:8px;
  padding:28px;
  margin-bottom:22px;
  transition:all .25s ease;
  opacity:0;
  transform:translateY(15px);
}

.post:hover {
  box-shadow:0 0 18px #fff;
}

.post-title {
  font-size:22px;
  margin-bottom:14px;
  text-shadow:0 0 6px #fff;
}

.post-content {
  line-height:1.8;
  color:#eee;
}

.post-img {
  width:100%;
  border-radius:6px;
  margin:16px 0;
  border:1px solid #fff;
}

.footer {
  text-align:center;
  margin-top:40px;
  color:#aaa;
  text-shadow:0 0 4px #aaa;
}

/*去掉超链接蓝色 */
a:link, a:visited, a:hover, a:active {
  color: #fff;
  text-decoration: none;
}
</style>
</head>

</style>
</head>

<body>
<div class="scanlines"></div>
<div class="container">
  <div class="header">
    <h1 class="nick">MICE.4</h1>
    <p class="real-name">m1c3_n04</p>
    <div id="time" class="time"></div>
  </div>


<a href="HELLO.html">  
  <div class="post">
    <h2 class="post-title">HELLO</h2>
    <div class="post-content">The quick brown fox jumps over the lazy dog</div>
  </div>
</a>

<a href="Meme_cat.html">
  <div class="post">
    <h2 class="post-title">just a meme cat</h2>
    <img src="images/meme_cat_1.jpg" class="post-img">
    <div class="post-content">Maow</div>
  </div>
</a>


<a href="drawing_guanling_1.html">
  <div class="post">
    <h2 class="post-title">观铃</h2>
    <img src="images/drawing_guanling_1.jpg" class="post-img">
    <div class="post-content">鼠鼠四号最近的画-画的观铃</div>
  </div>
</a>
  


  <div class="footer">m1c3_n04 © <span lang="en-us">Blog</span></div>
</div>

<script>
// 点击波纹
document.addEventListener('click',e=>{
  let r=document.createElement('div');
  r.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:8px;height:8px;background:#fff;border-radius:50%;pointer-events:none;animation:ripple .6s forwards`;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),600);
});

// 实时同步官方时间
function showTime() {
  const date = new Date();
  const h = String(date.getHours()).padStart(2, '0');
  const m = String(date.getMinutes()).padStart(2, '0');
  const s = String(date.getSeconds()).padStart(2, '0');
  const y = date.getFullYear();
  const mon = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  document.getElementById('time').innerText = `${y}-${mon}-${d} ${h}:${m}:${s}`;
}
showTime();
setInterval(showTime, 1000);

// 卡片渐入
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.post').forEach((p,i)=>{
    setTimeout(()=>{
      p.style.opacity=1;
      p.style.transform='translateY(0)';
    },i*120);
  });
});

const s=document.createElement('style');
s.innerHTML='@keyframes ripple{to{transform:scale(4);opacity:0}}';
document.head.appendChild(s);
</script>
</body>
</html>
