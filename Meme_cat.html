<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DETAIL - m1c3_n04</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:#000;
  color:#fff;
  font-family: "Courier New", Courier, "Lucida Console", Monospace;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 20px;
  cursor:pointer;
}

.scanlines {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:linear-gradient(to bottom, transparent 50%, rgba(20,20,20,.3) 50%);
  background-size:100% 4px;
  pointer-events:none;
  z-index:10;
}

.container {
  max-width:820px;
  width:100%;
  animation:fade 1s forwards;
  position:relative;
  z-index:1;
}

@keyframes fade {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.header {
  text-align:left;
  margin-bottom:20px;
  padding-left:4px;
}

.nick {
  font-size:36px;
  font-weight:900;
  color:#fff;
  text-shadow:0 0 12px #fff;
}

.real-name {
  font-size:16px;
  color:#ddd;
  margin-top:8px;
  text-shadow:0 0 6px #ddd;
}

.time {
  font-size:16px;
  color:#fff;
  margin-top:6px;
  text-shadow:0 0 8px #fff;
}

/* 返回按钮 */
.back {
  display:inline-block;
  margin-bottom:30px;
  padding:8px 14px;
  border:1px solid #fff;
  background:rgba(20,20,20,.7);
  color:#fff;
  text-decoration:none;
  border-radius:6px;
  text-shadow:0 0 6px #fff;
  transition:0.2s;
}
.back:hover {
  box-shadow:0 0 12px #fff;
}

/* 详情内容盒子 */
.detail-box {
  background:rgba(20,20,20,.7);
  border:1px solid #fff;
  border-radius:8px;
  padding:32px;
  margin-bottom:22px;
}

.detail-title {
  font-size:24px;
  margin-bottom:20px;
  text-shadow:0 0 8px #fff;
}

.detail-img {
  width:100%;
  border-radius:6px;
  margin:20px 0;
  border:1px solid #fff;
}

.detail-content {
  line-height:1.9;
  color:#eee;
  font-size:16px;
  white-space: pre-wrap;
}

.footer {
  text-align:center;
  margin-top:40px;
  color:#aaa;
  text-shadow:0 0 4px #aaa;
}
</style>
</head>

<body>
<div class="scanlines"></div>
<div class="container">
  <div class="header">
    <h1 class="nick">MICE.4</h1>
    <p class="real-name">m1c3_n04</p>
    <div id="time" class="time"></div>
  </div>

  <!-- 返回主页 -->
  <a href="index.html" class="back">← BACK</a>

  <!-- 详情内容 -->
  <div class="detail-box">
    <h2 class="detail-title">DETAIL INFORMATION</h2>
    <img src="images/meme_cat_1.jpg" class="detail-img">
    <div class="detail-content">
Maow. It's a silly cat.
一只傻耄
    </div>
  </div>

  <div class="footer">m1c3_n04 © DETAIL PAGE</div>
</div>

<script>
// 点击波纹
document.addEventListener('click',e=>{
  let r=document.createElement('div');
  r.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:8px;height:8px;background:#fff;border-radius:50%;pointer-events:none;animation:ripple .6s forwards`;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),600);
});

// 实时时间
function showTime() {
  const date = new Date();
  const h = String(date.getHours()).padStart(2, '0');
  const m = String(date.getMinutes()).padStart(2, '0');
  const s = String(date.getSeconds()).padStart(2, '0');
  const y = date.getFullYear();
  const mon = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  document.getElementById('time').innerText = `${y}-${mon}-${d} ${h}:${m}:${s}`;
}
showTime();
setInterval(showTime, 1000);

const s=document.createElement('style');
s.innerHTML='@keyframes ripple{to{transform:scale(4);opacity:0}}';
document.head.appendChild(s);
</script>
</body>
</html>
